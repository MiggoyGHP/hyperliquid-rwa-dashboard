name: Refresh market data

on:
  schedule:
    # ~21:35 UTC daily = after US market close (16:00 ET) in both DST regimes.
    # Daily (not weekdays-only) because crypto candles (BTC/ETH/HYPE) move on
    # weekends too; weekend stock re-bakes are harmless no-ops.
    - cron: "35 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency: refresh-data

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/refresh_data.py
      - run: python scripts/refresh_funding.py
        if: ${{ !cancelled() }}
      - run: python scripts/refresh_profiles.py
        if: ${{ !cancelled() }}
      - name: Commit refreshed data
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: refresh $(date -u +%F)"
          git push
